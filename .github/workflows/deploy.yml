name: Deploy to Cloudflare Workers

# Builds the OpenNext bundle and deploys to Cloudflare Workers on ubuntu-latest
# (glibc 2.39, so workerd runs fine — unlike older local distros).
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#
# Runtime Worker secrets — add any you use as GitHub repo secrets; they are synced to
# the Worker after every deploy (so a deploy can never drop them). Only non-empty ones
# are uploaded, so unset ones are skipped (they won't overwrite a dashboard value):
#   SUPABASE_SERVICE_ROLE_KEY (required), ENCRYPTION_SECRET, RESEND_API_KEY,
#   ANTHROPIC_API_KEY, REVALIDATE_SECRET, OPENAI_API_KEY
#
# NEXT_PUBLIC_* are public (project URL + publishable key) and default inline below;
# override them with repo Variables of the same name for a different environment.

on:
  workflow_dispatch: {}
  push:
    branches: [master]

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & deploy
        run: npm run deploy
        env:
          # Build-time (inlined into the client bundle by next build)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://cpcsxocziapgqpbtfytr.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_aKW4rI_xIGBIiHQbvD743A_9eq7X7Yz' }}
          # Wrangler auth (non-interactive)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Build a JSON of only the secrets that are actually set, then bulk-upload.
          # Values never printed; secrets.json is deleted immediately after.
          node -e '
            const names = ["SUPABASE_SERVICE_ROLE_KEY","ENCRYPTION_SECRET","RESEND_API_KEY","ANTHROPIC_API_KEY","REVALIDATE_SECRET","OPENAI_API_KEY"];
            const out = {};
            for (const n of names) { const v = process.env[n]; if (v && v.length) out[n] = v; }
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            const keys = Object.keys(out);
            console.log(keys.length ? "Syncing secrets: " + keys.join(", ") : "No GitHub secrets set — skipping sync");
            if (!keys.length) process.exit(0);
          '
          if [ -s secrets.json ] && [ "$(cat secrets.json)" != "{}" ]; then
            npx wrangler secret bulk secrets.json
          fi
          rm -f secrets.json
