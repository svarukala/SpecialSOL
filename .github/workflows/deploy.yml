name: Deploy to Cloudflare Workers

# Builds the OpenNext bundle and deploys to Cloudflare Workers on ubuntu-latest
# (glibc 2.39, so workerd runs fine — unlike older local distros).
#
# Required GitHub repo secret:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#
# NEXT_PUBLIC_* are public (project URL + publishable key) and default inline below;
# override them with repo Variables of the same name for a different environment.

on:
  workflow_dispatch: {}
  push:
    branches: [master]

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & deploy
        run: npm run deploy
        env:
          # Build-time (inlined into the client bundle by next build)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://cpcsxocziapgqpbtfytr.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_aKW4rI_xIGBIiHQbvD743A_9eq7X7Yz' }}
          # Wrangler auth (non-interactive)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
